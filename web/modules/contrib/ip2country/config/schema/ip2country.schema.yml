# Schema for the configuration files of the ip2country module.

ip2country.settings:
  type: config_object
  constraints:
    FullyValidatable: ~
  mapping:
    watchdog:
      type: boolean
      label: 'Log database updates to watchdog'
    rir:
      type: string
      label: 'RIR to use for database updates'
      constraints:
        AllowedValues: ['all', 'afrinic', 'apnic', 'arin', 'lacnic', 'ripe']
    md5_checksum:
      type: boolean
      label: 'Calculate and compare MD5 checksum for database updates'
    update_interval:
      type: integer
      label: 'Database update interval in seconds'
      constraints:
        AllowedValues: [0, 86400, 302400, 604800, 1209600, 2419200]
    batch_size:
      type: integer
      label: 'Database update batch size'
      constraints:
        Range:
          min: 1

    debug:
      type: boolean
      label: 'Operate in debug mode'
    test_type:
      type: integer
      label: 'Select country spoofing (0) or IP address spoofing (1)'
      constraints:
        AllowedValues: [0, 1]
    test_country:
      type: string
      label: 'Country to spoof'
      constraints:
        CountryCode: ~
    test_ip_address:
      type: string
      label: 'IP address to spoof'
      constraints:
        IpAddress: ~
