stages:
  - lint

phpcs:
  stage: lint
  image: php:8.2
  before_script:
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install
    - php composer.phar require --dev drupal/coder squizlabs/php_codesniffer sirbrillig/phpcs-variable-analysis slevomat/coding-standard squizlabs/php_codesniffer dealerdirect/phpcodesniffer-composer-installer
    - ./vendor/bin/phpcs --config-set installed_paths vendor/drupal/coder/coder_sniffer,vendor/slevomat/coding-standard,vendor/sirbrillig/phpcs-variable-analysis
  script:
    - ./vendor/bin/phpcs
        --standard=Drupal,DrupalPractice
        --extensions=php,module,inc,install,test,profile,theme
        web/modules/custom
        web/themes/custom

eslint:
  stage: lint
  image: node:18
  before_script:
    - npm install
  script:
    - npm run lint:js